.barra img{height:30px}
.barra .t{font-size:13px;color:var(--grisc);flex:1}
.idioma{display:flex;border:1px solid #333743;border-radius:999px;overflow:hidden}
.idioma button{background:none;border:0;color:var(--grisc);padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.idioma button.on{background:var(--azul);color:#fff}
.progreso{height:4px;background:#1A1C22}
.progreso i{display:block;height:100%;background:var(--azul);width:0;transition:width .3s}
main{max-width:880px;margin:0 auto;padding:28px 20px 120px}
.paso{display:none}.paso.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--azul);margin-bottom:8px}
h1{font-size:clamp(26px,4vw,36px);margin-bottom:12px}
h2{font-size:clamp(22px,3vw,28px);margin-bottom:6px}
.sub{color:var(--gris);margin:0 0 24px;max-width:640px}
.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:22px;margin-bottom:16px}
.campo{margin-bottom:18px}
.campo:last-child{margin-bottom:0}
label.et,.et{display:block;font-weight:600;margin-bottom:8px;font-size:15px}
.et small{font-weight:400;color:var(--gris)}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;border:1px solid var(--linea);border-radius:10px;padding:11px 13px;background:#fff;outline:none;transition:border .15s}
input:focus,textarea:focus{border-color:var(--azul);box-shadow:0 0 0 3px var(--azulc)}
textarea{min-height:76px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.dos .campo{margin-bottom:0}
.tarjeta>.dos:last-child,.tarea-det .dos{margin-bottom:0}
@media(max-width:620px){.dos{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;transition:all .12s;user-select:none}
.chip:hover{border-color:var(--azul)}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.chip.sm{padding:6px 11px;font-size:13px}
.industrias{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ind{border:1px solid var(--linea);background:#fff;border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;font-size:14px;line-height:1.35;transition:all .12s}
.ind b{display:block;font-family:Poppins,Inter;font-size:15px;margin-bottom:2px}
.ind span{color:var(--gris);font-size:13px}
.ind:hover{border-color:var(--azul)}
.ind.on{border-color:var(--azul);box-shadow:0 0 0 2px var(--azul) inset;background:#F7FAFF}
.area-tit{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.area-tit h3{font-size:18px}
.area-tit span{color:var(--gris);font-size:14px}
.area-num{background:var(--tinta);color:#fff;border-radius:999px;width:26px;height:26px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;flex:none;align-self:center}
.tarea{background:#fff;border:1px solid var(--linea);border-radius:14px;margin-bottom:10px;overflow:hidden}
.tarea-cab{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.tarea-cab .nom{flex:1;font-weight:600;min-width:200px}
.tarea-cab .nom input{font-weight:600}
.sino{display:flex;gap:6px}
.tarea.no .tarea-det{display:none}
.sino .chip.on[data-v="0"]{background:var(--gris);border-color:var(--gris)}
.tarea.no{opacity:.75}
.tarea.si{border-color:#B9D2FF}
.tarea-det{border-top:1px solid var(--linea);padding:14px 16px;display:grid;gap:14px;background:#FBFCFE}
.tarea-det .et{font-size:13px;margin-bottom:6px;color:var(--gris);font-weight:600}
.tarea.pend .tarea-det{display:none}
.dolor .chip.on[data-v="1"]{background:var(--verde);border-color:var(--verde)}
.dolor .chip.on[data-v="2"]{background:var(--ambar);border-color:var(--ambar);color:var(--tinta)}
.dolor .chip.on[data-v="3"]{background:var(--rojo);border-color:var(--rojo)}
.agregar{border:1px dashed var(--grisc);background:none;border-radius:12px;padding:12px 16px;width:100%;text-align:left;color:var(--gris);cursor:pointer}
.agregar:hover{border-color:var(--azul);color:var(--azul)}
.pregunta-seg{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.pregunta-seg:last-child{border-bottom:0}
.pregunta-seg p{margin:0;flex:1;min-width:240px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--linea);backdrop-filter:blur(6px);z-index:5}
.nav div{max-width:880px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center}
.nav .info{flex:1;font-size:13px;color:var(--gris)}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:15px}
.btn.pri{background:var(--azul);color:#fff}
.btn.pri:hover{background:var(--azul2)}
.btn.sec{background:#fff;border:1px solid var(--linea)}
.btn.osc{background:var(--tinta);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.hero{background:var(--tinta);color:#fff;border-radius:20px;padding:34px 30px;margin-bottom:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(2,107,248,.55),transparent 70%)}
.hero p{color:#C9CED8;max-width:560px}
.lista-pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
@media(max-width:620px){.lista-pasos{grid-template-columns:1fr}}
.lista-pasos div{background:#1A1C22;border-radius:12px;padding:14px;font-size:14px;color:#C9CED8}
.lista-pasos b{display:block;color:#fff;font-family:Poppins;font-size:22px;color:var(--azul)}
.aviso{background:var(--azulc);border-radius:12px;padding:12px 14px;font-size:14px;color:#123}
.error{color:var(--rojo);font-size:13px;margin-top:6px;display:none}
.error.on{display:block}
.resumen-envio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:620px){.resumen-envio{grid-template-columns:1fr}}
.resumen-envio div{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px}
.resumen-envio b{font-family:Poppins;font-size:28px;display:block;color:var(--azul)}
.ok-envio{text-align:center;padding:50px 20px}
.ok-envio .circ{width:72px;height:72px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:36px}
.oculto{display:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>

/* ---------- Estado ---------- */
var E = cargar() || nuevo();
function nuevo(){
  var p = new URLSearchParams(location.search);
  return { formato:"respuestas-diagnostico/express-1", version:1, idioma: p.get("idioma")==="en"?"en":(p.get("lang")==="en"?"en":"es"), paso:0,
    empresa:{nombre:p.get("cliente")||"", industria:"", industria_otra:"", que_venden:"", ubicacion:"", personas:"", canales:[]},
    herramientas:{lista:[], otras:"", informacion:"", persona_clave:""},
    tareas:[], prioridades:{frustraciones:["","",""], horas_extra:[], meta_90:"", ia_uso:""},
    seguridad:{}, respondente:{nombre:"", cargo:"", email:"", telefono:""} };
}
function cargar(){ try{ var s=localStorage.getItem(CLAVE_LS); return s?JSON.parse(s):null; }catch(e){ return null; } }
var tGuardar;
function guardar(){ clearTimeout(tGuardar); tGuardar=setTimeout(function(){ try{ localStorage.setItem(CLAVE_LS, JSON.stringify(E)); }catch(e){} }, 200); }
function get(ruta){ return ruta.split(".").reduce(function(o,k){ return o==null?undefined:o[k]; }, E); }
function set(ruta,v){ var ks=ruta.split("."), o=E; for(var i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=v; guardar(); }
function tx(k){ return (T[E.idioma]||T.es)[k]||k; }
function L(par){ return E.idioma==="en"?par[2]:par[1]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* ---------- Tareas según industria ---------- */
function prepararTareas(){
  var ind = CATALOGO.INDUSTRIAS[E.empresa.industria]; if(!ind) return;
  var propias = E.tareas.filter(function(t){ return t.propia; });
  var previas = {}; E.tareas.forEach(function(t){ if(!t.propia) previas[t.id]=t; });
  E.tareas = ind.tareas.map(function(r){
    var base = CATALOGO.TAREAS[r[0]], id = E.empresa.industria+"-"+r[0];
    var t = previas[id] || { id:id, base:r[0], area:base.area, hace:null, como:[], quien:"", horas:"", dolor:null, nota:"" };
    t.nombre_es = r[1]||base.es; t.nombre_en = r[2]||base.en; return t;
  }).concat(propias);
  guardar();
}

/* ---------- Pintar ---------- */
function pintarTextos(){
  document.documentElement.lang = E.idioma;
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = tx(el.getAttribute("data-t")); });
  document.querySelectorAll("[data-ph]").forEach(function(el){ el.placeholder = tx(el.getAttribute("data-ph")); });
  document.querySelectorAll("[data-idioma]").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-idioma")===E.idioma); });
}
function pintarCampos(){
  document.querySelectorAll("[data-k]").forEach(function(el){ var v=get(el.getAttribute("data-k")); el.value = v==null?"":v; });
  document.querySelectorAll("[data-uno]").forEach(function(c){ pintarChips(c, OPCIONES[c.getAttribute("data-op")], c.getAttribute("data-uno"), false); });
  document.querySelectorAll("[data-varios]").forEach(function(c){ pintarChips(c, OPCIONES[c.getAttribute("data-op")], c.getAttribute("data-varios"), true); });
}
function pintarChips(cont, ops, ruta, varios){
  var v = get(ruta);
  cont.innerHTML = ops.map(function(o){
    var on = varios ? (v||[]).indexOf(o[0])>=0 : v===o[0];
    return '<span class="chip'+(on?' on':'')+'" data-v="'+o[0]+'">'+esc(L(o))+'</span>';
  }).join("");
  cont.onclick = function(e){ var c=e.target.closest(".chip"); if(!c) return; var val=c.getAttribute("data-v");
    if(varios){ var a=(get(ruta)||[]).slice(), i=a.indexOf(val); if(i>=0) a.splice(i,1); else a.push(val); set(ruta,a); }
    else set(ruta, get(ruta)===val?"":val);
    pintarChips(cont, ops, ruta, varios); };
}
function pintarIndustrias(){
  var c = document.getElementById("industrias");
  c.innerHTML = Object.keys(CATALOGO.INDUSTRIAS).map(function(k){
    var ind=CATALOGO.INDUSTRIAS[k], nom=E.idioma==="en"?ind.en:ind.es, m=nom.match(/^([^(]+)(\((.*)\))?/);
    return '<button type="button" class="ind'+(E.empresa.industria===k?' on':'')+'" data-ind="'+k+'"><b>'+esc(m[1].trim())+'</b>'+(m[3]?'<span>'+esc(m[3])+'</span>':'')+'</button>';
  }).join("");
  document.getElementById("campoIndOtra").classList.toggle("oculto", E.empresa.industria!=="otro");
}
document.getElementById("industrias").addEventListener("click", function(e){
  var b=e.target.closest(".ind"); if(!b) return;
  E.empresa.industria=b.getAttribute("data-ind"); prepararTareas(); pintarIndustrias();
  document.getElementById("errIndustria").classList.remove("on");
});

function pintarTareas(){
  var cont=document.getElementById("tareas");
  if(!E.empresa.industria){ cont.innerHTML='<div class="aviso">'+esc(tx("falta_ind"))+'</div>'; return; }
  var html="", n=0;
  Object.keys(CATALOGO.AREAS).forEach(function(a){
    n++; var ar=CATALOGO.AREAS[a];
    html+='<div class="area-tit"><span class="area-num">'+n+'</span><h3>'+esc(E.idioma==="en"?ar.en:ar.es)+'</h3><span>'+esc(E.idioma==="en"?ar.d_en:ar.d_es)+'</span></div>';
    E.tareas.forEach(function(t,i){ if(t.area===a) html+=htmlTarea(t,i); });
    html+='<button type="button" class="agregar" data-agregar="'+a+'">'+esc(tx("agregar"))+'</button>';
  });
  cont.innerHTML=html;
}
function htmlTarea(t,i){
  var est = t.hace===true?"si":(t.hace===false?"no":"pend");
  var nom = t.propia ? '<input type="text" data-propia="'+i+'" value="'+esc(t.nombre)+'" placeholder="'+esc(tx("ph_propia"))+'">' : esc(E.idioma==="en"?t.nombre_en:t.nombre_es);
  function chips(ops,campo,varios){ return '<div class="chips'+(campo==="dolor"?" dolor":"")+'">'+ops.map(function(o){
      var v=t[campo], on=varios?(v||[]).indexOf(o[0])>=0:String(v)===o[0];
      return '<span class="chip sm'+(on?' on':'')+'" data-i="'+i+'" data-campo="'+campo+'" data-multi="'+(varios?1:0)+'" data-v="'+o[0]+'">'+esc(L(o))+'</span>'; }).join("")+'</div>'; }
  return '<div class="tarea '+est+'" data-tarea="'+i+'"><div class="tarea-cab"><div class="nom">'+nom+'</div><div class="sino">'+
    '<span class="chip sm'+(t.hace===true?' on':'')+'" data-hace="'+i+'" data-v="1">'+esc(tx("hace_si"))+'</span>'+
    (t.propia?'<span class="chip sm" data-quitar="'+i+'">'+esc(tx("quitar"))+'</span>':'<span class="chip sm'+(t.hace===false?' on':'')+'" data-hace="'+i+'" data-v="0">'+esc(tx("hace_no"))+'</span>')+
    '</div></div><div class="tarea-det">'+
    '<div><div class="et">'+esc(tx("t_como"))+'</div>'+chips(CATALOGO.COMO,"como",true)+'</div>'+
    '<div class="dos"><div><div class="et">'+esc(tx("t_quien"))+'</div>'+chips(CATALOGO.QUIEN,"quien",false)+'</div>'+
    '<div><div class="et">'+esc(tx("t_horas"))+'</div>'+chips(CATALOGO.HORAS,"horas",false)+'</div></div>'+
    '<div><div class="et">'+esc(tx("t_dolor"))+'</div>'+chips(CATALOGO.DOLOR.map(function(d){return [String(d[0]),d[1],d[2]];}),"dolor",false)+'</div>'+
    '<div><div class="et">'+esc(tx("t_nota"))+'</div><input type="text" data-nota="'+i+'" value="'+esc(t.nota)+'" placeholder="'+esc(tx("ph_nota"))+'"></div>'+
    '</div></div>';
}
document.getElementById("tareas").addEventListener("click", function(e){
  var el;
  if((el=e.target.closest("[data-agregar]"))){ E.tareas.push({id:"propia-"+Date.now(), base:null, area:el.getAttribute("data-agregar"), propia:true, nombre:"", hace:true, como:[], quien:"", horas:"", dolor:null, nota:""}); guardar(); pintarTareas(); var ins=document.querySelectorAll("[data-propia]"); if(ins.length) ins[ins.length-1].focus(); return; }
  if((el=e.target.closest("[data-quitar]"))){ E.tareas.splice(+el.getAttribute("data-quitar"),1); guardar(); pintarTareas(); return; }
  if((el=e.target.closest("[data-hace]"))){ var t=E.tareas[+el.getAttribute("data-hace")], v=el.getAttribute("data-v")==="1"; t.hace = t.hace===v?null:v; guardar(); pintarTareas(); return; }
  if((el=e.target.closest("[data-campo]"))){ var t2=E.tareas[+el.getAttribute("data-i")], c=el.getAttribute("data-campo"), val=el.getAttribute("data-v");
    if(c==="dolor") val=+val;
    if(el.getAttribute("data-multi")==="1"){ var a=(t2[c]||[]).slice(), k=a.indexOf(val); if(k>=0) a.splice(k,1); else a.push(val); t2[c]=a; }
    else t2[c] = t2[c]===val?(c==="dolor"?null:""):val;
    guardar(); var box=el.parentNode; box.querySelectorAll(".chip").forEach(function(ch){ var vv=ch.getAttribute("data-v"); if(c==="dolor") vv=+vv; ch.classList.toggle("on", Array.isArray(t2[c])?t2[c].indexOf(vv)>=0:t2[c]===vv); }); }
});
document.getElementById("tareas").addEventListener("input", function(e){
  var el=e.target;
  if(el.hasAttribute("data-nota")){ E.tareas[+el.getAttribute("data-nota")].nota=el.value; guardar(); }
  if(el.hasAttribute("data-propia")){ E.tareas[+el.getAttribute("data-propia")].nombre=el.value; guardar(); }
});

function pintarSeguridad(){
  document.getElementById("seguridad").innerHTML = CATALOGO.SEGURIDAD.map(function(s){
    return '<div class="pregunta-seg"><p>'+esc(E.idioma==="en"?s[2]:s[1])+'</p><div class="chips" data-uno="seguridad.'+s[0]+'" data-op="SEG"></div></div>';
  }).join("");
  document.querySelectorAll("#seguridad [data-uno]").forEach(function(c){ pintarChips(c, OPCIONES.SEG, c.getAttribute("data-uno"), false); });
}

document.addEventListener("input", function(e){ var k=e.target.getAttribute && e.target.getAttribute("data-k"); if(k) set(k, e.target.value); });

/* ---------- Navegación ---------- */
var TOTAL=7;
function ir(p){
  E.paso=Math.max(0,Math.min(TOTAL-1,p)); guardar();
  document.querySelectorAll(".paso").forEach(function(s){ s.classList.toggle("on", +s.getAttribute("data-paso")===E.paso); });
  document.getElementById("barraProg").style.width = (E.paso/(TOTAL-1)*100)+"%";
  document.getElementById("btnAtras").style.visibility = E.paso===0?"hidden":"visible";
  var sig=document.getElementById("btnSig"); sig.classList.toggle("oculto", E.paso===TOTAL-1);
  sig.textContent = E.paso===0?tx("btn_empezar"):tx("btn_sig");
  document.getElementById("navInfo").textContent = E.paso>0 ? tx("guardado") : "";
  if(E.paso===3) pintarTareas();
  if(E.paso===6) resumen();
  window.scrollTo(0,0);
}
function validar(){
  if(E.paso===1){
    var ok=true;
    if(!E.empresa.nombre.trim()){ document.getElementById("errEmpresa").classList.add("on"); ok=false; } else document.getElementById("errEmpresa").classList.remove("on");
    if(!E.empresa.industria){ document.getElementById("errIndustria").classList.add("on"); ok=false; }
    return ok;
  }
  return true;
}
document.getElementById("btnSig").onclick=function(){ if(validar()) ir(E.paso+1); };
document.getElementById("btnAtras").onclick=function(){ ir(E.paso-1); };
document.querySelectorAll("[data-idioma]").forEach(function(b){ b.onclick=function(){ E.idioma=b.getAttribute("data-idioma"); guardar(); todo(); }; });

/* ---------- Resumen y envío ---------- */
function horasDe(t){ var h=CATALOGO.HORAS.filter(function(x){return x[0]===t.horas;})[0]; return h?h[3]:0; }
function resumen(){
  var hechas=E.tareas.filter(function(t){return t.hace;});
  document.getElementById("rTareas").textContent=hechas.length;
  document.getElementById("rHoras").textContent="≈ "+Math.round(hechas.reduce(function(s,t){return s+horasDe(t);},0));
  document.getElementById("rDolor").textContent=hechas.filter(function(t){return t.dolor===3;}).length;
}
function paquete(){
  var d=JSON.parse(JSON.stringify(E)); delete d.paso; d.generado=new Date().toISOString();
  d.tareas=d.tareas.filter(function(t){ return !(t.propia && !String(t.nombre||"").trim()); });
  d.prioridades.frustraciones=d.prioridades.frustraciones.filter(function(f){return f&&f.trim();});
  return d;
}
function nombreArchivo(){ var n=(E.empresa.nombre||"negocio").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); return "respuestas-express-"+n+".json"; }
function descargar(){
  var b=new Blob([JSON.stringify(paquete(),null,2)],{type:"application/json"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=nombreArchivo(); document.body.appendChild(a); a.click(); a.remove();
}
function contactoOk(){ var ok=E.respondente.nombre.trim() && /.+@.+\..+/.test(E.respondente.email); document.getElementById("errContacto").classList.toggle("on",!ok); return ok; }
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); setTimeout(function(){t.classList.remove("on");},3200); }
document.getElementById("btnDescargar").onclick=function(){ descargar(); };
document.getElementById("btnEnviar").onclick=function(){
  if(!contactoOk()) return;
  if(!WEBHOOK || /claude\.ai|claudeusercontent|artifact/.test(location.hostname)){ toast(tx("vista")); return; }
  var b=this; b.disabled=true; b.textContent=tx("enviando");
  var cuerpo=JSON.stringify(paquete());
  function ok(){ document.getElementById("envioForm").classList.add("oculto"); document.getElementById("envioOk").classList.remove("oculto"); document.querySelector(".nav").classList.add("oculto"); try{ localStorage.removeItem(CLAVE_LS); }catch(e){} }
  function mal(){ b.disabled=false; b.textContent=tx("btn_enviar"); toast(tx("fallo")); }
  fetch(WEBHOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:cuerpo}).then(ok).catch(mal);
};

function todo(){ pintarTextos(); pintarCampos(); pintarIndustrias(); pintarSeguridad(); if(E.paso===3) pintarTareas(); ir(E.paso); }
if(E.empresa.industria && !E.tareas.length) prepararTareas();
todo();
</script>
